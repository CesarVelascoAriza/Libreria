name: Preparar version de release

on:
  push:
    branches: ["release/*"]

permissions:
  contents: write

jobs:
  set-version:
    name: Fijar version del artefacto segun la rama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validar nombre de rama release/X.Y.Z
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "La rama debe ser release/X.Y.Z"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Actualizar version en todos los poms
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Compilar y probar con la nueva version
        run: mvn -B test

      - name: Commit de la version
        run: |
          if git diff --quiet; then
            echo "La version ya es $VERSION"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): version $VERSION"
            git push
          fi
