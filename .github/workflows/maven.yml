name: CI/CD Java con Git Flow

on:
  pull_request:
    branches: ["develop", "master"]
  push:
    branches: ["develop", "master"]
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build y pruebas por microservicio
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - DominioNegocio/service-books
          - DominioNegocio/service-users
          - Seguridad/seguridad
          - Infraestructura/gateway-service

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas del microservicio
        working-directory: ${{ matrix.module }}
        run: ./mvnw test

  release:
    name: Crear release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generar artefactos del proyecto
        run: mvn -B package -DskipTests

      - name: Crear release automático
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
