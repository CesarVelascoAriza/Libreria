name: CI/CD Java con Git Flow

on:
  pull_request:
    branches: ["develop", "develp", "master", "release/*"]
  push:
    branches: ["develop", "develp", "master"]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build y pruebas por microservicio
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - DominioNegocio/service-books
          - DominioNegocio/service-users
          - Seguridad/seguridad
          - Infraestructura/gateway-service

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas del microservicio
        run: mvn -B -pl ${{ matrix.module }} -am test

  prerelease:
    name: Publicar pre-release de develp
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develp'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generar artefactos
        run: mvn -B package -DskipTests

      - name: Reemplazar pre-release develp-latest
        run: |
          gh release delete develp-latest --cleanup-tag --yes || true
          gh release create develp-latest \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "develp (pre-release)" \
            --generate-notes \
            DominioNegocio/service-books/target/*.jar \
            DominioNegocio/service-users/target/*.jar \
            Seguridad/seguridad/target/*.jar \
            Infraestructura/gateway-service/target/*.jar
