name: Crear rama release desde develp

on:
  push:
    branches: ["develp"]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-branch:
    name: Calcular version y crear release/X.Y.Z
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Determinar tipo de cambio (major / minor / patch)
        id: bump
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" =~ ^0+$ ]]; then RANGE="HEAD~1..HEAD"; else RANGE="$BEFORE..${{ github.sha }}"; fi
          LOG=$(git log "$RANGE" --format='%s%n%b' | tr 'A-Z' 'a-z')

          if echo "$LOG" | grep -Eq 'breaking change|^[a-z]+(\([^)]*\))?!:'; then TYPE=major
          elif echo "$LOG" | grep -Eq '^(feat|mejora|improve|enhancement)|from [^ ]*/(feat|feature|mejora|improve)[/-]'; then TYPE=minor
          elif echo "$LOG" | grep -Eq '^(fix|bug|hotfix|refactor)|from [^ ]*/(fix|bugfix|hotfix|refactor)[/-]'; then TYPE=patch
          else TYPE=none; fi
          echo "Tipo de cambio: $TYPE"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Calcular nueva version desde el ultimo tag
        if: steps.bump.outputs.type != 'none'
        run: |
          LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          LAST=${LAST#v}; LAST=${LAST:-0.0.0}
          IFS=. read -r MA MI PA <<< "$LAST"
          case "${{ steps.bump.outputs.type }}" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          echo "VERSION=$MA.$MI.$PA" >> "$GITHUB_ENV"
          echo "Version anterior $LAST -> $MA.$MI.$PA"

      - name: Actualizar version en todos los poms y probar
        if: steps.bump.outputs.type != 'none'
        run: |
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B test

      - name: Crear (o reemplazar) la rama release y abrir PR a master
        if: steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/$VERSION"
          git commit -am "chore(release): version $VERSION"
          git push --force origin "release/$VERSION"
          gh pr create --base master --head "release/$VERSION" \
            --title "Release $VERSION" \
            --body "Release $VERSION generada desde develp (cambio: ${{ steps.bump.outputs.type }}). Al mergear se crea el tag v$VERSION, el release y se elimina esta rama." \
            || echo "El PR ya existe o no se pudo crear"
