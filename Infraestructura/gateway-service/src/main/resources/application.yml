spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  security:
    oauth2:
      resourceserver:
        jwt:
          # Aquí va la URL base de tu Servidor de Autorización (el que configuramos a las 9000)
          issuer-uri: ${OAUTH-SERVER:http://localhost:9000}
          jwk-set-uri: ${OAUTH-SERVER:http://localhost:9000}/oauth2/jwks
      client:
        registration:
          gateway-app:
            client-id: gateway-app
            client-secret: gateway-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - read
              - write
        provider:
          gateway-app:
            authorization-uri: ${OAUTH-SERVER:http://localhost:9000}/oauth2/authorize
            token-uri: ${OAUTH-SERVER:http://localhost:9000}/oauth2/token
            jwk-set-uri: ${OAUTH-SERVER:http://localhost:9000}/oauth2/jwks
            user-info-uri: ${OAUTH-SERVER:http://localhost:9000}/userinfo
            user-name-attribute: sub
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: service-books
              uri: lb://service-books
              predicates:
                - Path=/api/books/**
              filters:
                - StripPrefix=2
            - id: auth
              uri: lb://service-oauth2-authorization-server
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            # Escritura de usuarios pasa por el auth para cifrar la clave
            - id: service-users-write
              uri: lb://service-oauth2-authorization-server
              predicates:
                - Path=/api/users/**
                - Method=POST,PUT
              filters:
                - StripPrefix=1
            - id: service-users
              uri: lb://service-users
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: service-books
        url: /api/books/v3/api-docs
      - name: service-users
        url: /api/users/v3/api-docs

server:
  port: ${PORT:8760}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}} #dejar la instancia de forma dinamica donde se toma el nombre de el servicio y el puerto

